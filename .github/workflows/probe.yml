name: Uptime probe

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub may delay scheduled runs by a few minutes under load
  workflow_dispatch:

permissions:
  contents: write   # push to the data branch
  actions: write    # keep this schedule from being auto-disabled

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Load previous data
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            mkdir -p data && git --work-tree=data checkout FETCH_HEAD -- . 2>/dev/null || true
            git reset -q
          fi

      - name: Probe targets
        run: node probe.mjs data

      - name: Publish data branch (single commit, force-pushed)
        working-directory: data
        run: |
          git init -q -b data
          git config user.name "mission-control-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary.json status.json
          git commit -q -m "Status $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "00" ] && [ "$(date -u +%M)" -lt 10 ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/probe.yml/enable"
          fi
